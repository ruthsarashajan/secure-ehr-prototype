<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Simulated EHR</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header class="site-header">
        <h2>Simulated EHR Security Prototype</h2>
    </header>

    <main class="page-container">
        <section class="panel">
            <h1>Secure Login</h1>
            <p class="introduction">
                Sign in using your assigned account.
            </p>

            <form method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required>
                </div>

                <button class="login-button" type="submit">
                    Login
                </button>
            </form>

            <a class="page-link" href="/">Back to homepage</a>
        </section>
    </main>
</body>
</html>
