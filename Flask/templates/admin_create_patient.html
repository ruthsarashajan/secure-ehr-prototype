<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Patient</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="site-header">
        <h2>Simulated EHR Security Prototype</h2>
    </header>

    <main class="dashboard-container">

        <section class="panel">

            <h1>Add a New Patient</h1>

            {% if error %}
                <p>{{ error }}</p>
            {% endif %}

            {% if success %}
                <p>{{ success }}</p>
            {% endif %}

            <form method="POST" action="/admin/patients/new">

                <h2>Account Details</h2>

                <div class="form-group">
                    <label for="username">Username</label>

                    <input type="text"
                           id="username"
                           name="username"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Temporary Password</label>

                    <input type="password"
                           id="password"
                           name="password"
                           required>
                </div>

                <h2>Patient Details</h2>

                <div class="form-group">
                    <label for="first_name">First Name</label>

                    <input type="text"
                           id="first_name"
                           name="first_name"
                           required>
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name</label>

                    <input type="text"
                           id="last_name"
                           name="last_name"
                           required>
                </div>

                <div class="form-group">
                    <label for="date_of_birth">Date of Birth</label>

                    <input type="date"
                           id="date_of_birth"
                           name="date_of_birth"
                           required>
                </div>

                <button class="button" type="submit">
                    Create Patient
                </button>
                
            </form>

            <p>
                <a class="page-link" href="/admin/dashboard">
                    Back to Admin Dashboard
                </a>
            </p>

        </section>

    </main>

</body>
</html>
